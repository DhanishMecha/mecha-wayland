[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:edge"

pre-build = [
    """
    dpkg --add-architecture arm64 && \
    echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main universe multiverse restricted' > /etc/apt/sources.list.d/arm64.list && \
    echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe multiverse restricted' >> /etc/apt/sources.list.d/arm64.list && \
    echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main universe multiverse restricted' >> /etc/apt/sources.list.d/arm64.list && \
    apt-get update && \
    apt-get install -y --no-install-recommends \
        clang \
        libgbm-dev:arm64 \
        libdrm-dev:arm64 \
        libegl1-mesa-dev:arm64 \
        libwayland-dev:arm64
    """
]